<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Qué Comemos?</title>
<meta name="description" content="Votá qué comida querés y mirá cuántos piden cada plato.">
<meta property="og:title" content="¿Qué comemos hoy?">
<meta property="og:description" content="Poné tu nombre y votá tu comida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef2ee; --paper:#ffffff; --ink:#18231c; --muted:#5d6b62; --line:#d5ddd6;
  --basil:#1f6b45; --basil-soft:#dcefe3; --mustard:#f2b632; --mustard-ink:#3b2a00;
  --danger:#b3261e;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111813; --paper:#18221b; --ink:#e8efe9; --muted:#9aaa9f; --line:#2c3a30;
  --basil:#5fcf92; --basil-soft:#1d3427; --mustard:#f2b632; --mustard-ink:#2a1e00; --danger:#ff8a80;
  color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;background:var(--mustard);color:var(--mustard-ink);padding:0 .15em;border-radius:6px}
.lead{color:var(--muted);margin:0}
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;position:relative}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-1px;height:6px;border-radius:14px 14px 0 0;
  background:repeating-linear-gradient(90deg,var(--basil) 0 14px,transparent 14px 22px)}
[hidden]{display:none!important}
h2{font-family:var(--display);font-weight:800;font-size:1.4rem;margin:0;line-height:1.15}
label{font-weight:600;font-size:14px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--basil);box-shadow:0 0 0 3px var(--basil-soft)}
button{font:inherit;cursor:pointer}
.btn{background:var(--basil);color:var(--paper);border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--basil);border:1.5px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.who b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--basil);font-weight:600;padding:4px;text-decoration:underline}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.opt .n{font-weight:700;font-size:17px}
.opt .d{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--basil);background:var(--basil-soft);box-shadow:inset 0 0 0 1px var(--basil)}
.res{display:flex;flex-direction:column;gap:14px}
.res-item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.res-item .n{font-weight:700}
.res-item .c{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.bar{grid-column:1/-1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--basil);border-radius:6px;transition:width .4s}
.res-item.top .bar i{background:var(--mustard)}
.names{grid-column:1/-1;font-size:13px;color:var(--muted)}
.total{display:flex;justify-content:space-between;border-top:1.5px dashed var(--line);padding-top:12px;font-weight:700}
.total span:last-child{font-family:var(--mono)}
.mine{font-size:12px;font-family:var(--mono);background:var(--mustard);color:var(--mustard-ink);padding:1px 6px;border-radius:4px;margin-left:6px}
.note{font-size:14px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:14px;margin:0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Votación del almuerzo</span>
    <h1>¿Qué <em>comemos</em> hoy?</h1>
    <p class="lead">Poné tu nombre, elegí tu comida y mirá cuántos piden cada plato.</p>
  </header>

  <section class="ticket" id="stepName">
    <h2>Ingresá con tu nombre</h2>
    <form id="nameForm" style="display:flex;flex-direction:column;gap:10px">
      <label for="nameInput">Tu nombre</label>
      <input type="text" id="nameInput" maxlength="40" autocomplete="given-name" placeholder="Ej: Mateo">
      <button class="btn" id="nameBtn" type="submit" disabled>Ingresar</button>
    </form>
  </section>

  <section class="ticket" id="stepVote" hidden>
    <div class="who"><span>Votando como <b id="whoName"></b></span><button class="linkbtn" id="changeName" type="button">Cambiar nombre</button></div>
    <h2>Elegí tu comida</h2>
    <div class="menu" id="menu" role="group" aria-label="Opciones de comida"></div>
    <button class="btn" id="voteBtn" type="button" disabled>Aceptar voto</button>
    <p class="err" id="voteErr" hidden></p>
  </section>

  <section class="ticket" id="stepResults">
    <div class="row" style="justify-content:space-between">
      <h2>Conteo de pedidos</h2>
      <button class="btn ghost" id="revote" type="button" hidden>Cambiar mi voto</button>
    </div>
    <div class="res" id="results"><p class="note">Todavía no votó nadie. El primer voto aparece acá al instante.</p></div>
    <div class="total"><span>Personas que comen</span><span id="total">0</span></div>
    <p class="note" id="status">Conectando…</p>
  </section>
</div>

<script type="module">
// ============================================================
// 1) PEGÁ ACÁ LA CONFIGURACIÓN DE TU PROYECTO DE FIREBASE
//    (Firebase → Configuración del proyecto → Tus apps → Web)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDbkLzJgAnQSZxWJB9xXdDUpPtnGRG77z8",
  authDomain: "que-comemos-281f9.firebaseapp.com",
  projectId: "que-comemos-281f9",
  storageBucket: "que-comemos-281f9.firebasestorage.app",
  messagingSenderId: "997834086367",
  appId: "1:997834086367:web:84d7cc89cf9abf88d9966a"
};

// 2) Comidas del menú. Si cambiás los "id", cambialos también en las reglas de Firestore.
const FOODS = [
  {id:"milanesa",    n:"Milanesa",    d:"Con papas fritas"},
  {id:"pizza",       n:"Pizza",       d:"Muzzarella"},
  {id:"empanadas",   n:"Empanadas",   d:"Carne y jyq"},
  {id:"hamburguesa", n:"Hamburguesa", d:"Completa"},
  {id:"pastas",      n:"Pastas",      d:"Ñoquis o ravioles"},
  {id:"ensalada",    n:"Ensalada",    d:"Opción liviana"}
];

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
let db = null, uid = null, myName = "", picked = null, votes = [], hasVoted = false;

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

// ---- Menú
FOODS.forEach(f=>{
  const b=document.createElement("button");
  b.type="button"; b.className="opt"; b.dataset.id=f.id; b.setAttribute("aria-pressed","false");
  const n=document.createElement("span"); n.className="n"; n.textContent=f.n;
  const d=document.createElement("span"); d.className="d"; d.textContent=f.d;
  b.append(n,d);
  b.addEventListener("click",()=>{ picked=f.id; renderMenu(); });
  $("menu").appendChild(b);
});
function renderMenu(){
  document.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.id===picked)));
  $("voteBtn").disabled = !picked || !db || !uid;
}

// ---- Pantallas
function show(step){
  $("stepName").hidden = step!=="name";
  $("stepVote").hidden = step!=="vote";
  $("revote").hidden = step!=="done";
}

// ---- Nombre
$("nameInput").addEventListener("input",e=>{ $("nameBtn").disabled = !e.target.value.trim(); });
$("nameForm").addEventListener("submit",e=>{
  e.preventDefault();
  const v=$("nameInput").value.trim().slice(0,40); if(!v) return;
  myName=v; store.set("qc-name",v); $("whoName").textContent=v; show("vote"); renderMenu();
});
$("changeName").addEventListener("click",()=>{
  $("nameInput").value=myName; $("nameBtn").disabled=!myName; show("name"); $("nameInput").focus();
});
$("revote").addEventListener("click",()=>{ $("whoName").textContent=myName; show("vote"); renderMenu(); });

// ---- Votar (cada dispositivo tiene un solo voto: el documento se llama como su id)
$("voteBtn").addEventListener("click", async ()=>{
  if(!db||!uid||!picked) return;
  $("voteBtn").disabled=true; $("voteErr").hidden=true;
  try{
    await setDoc(doc(db,"votes",uid), {name:myName, food:picked, at:Date.now()});
    hasVoted=true; show("done");
    $("stepResults").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  }catch(err){
    console.error(err);
    $("voteErr").textContent="No se pudo guardar el voto. Revisá tu conexión y probá de nuevo.";
    $("voteErr").hidden=false;
  }finally{ renderMenu(); }
});

// ---- Resultados
function renderResults(){
  const box=$("results"); box.textContent="";
  $("total").textContent=votes.length;
  if(!votes.length){
    const p=document.createElement("p"); p.className="note";
    p.textContent="Todavía no votó nadie. El primer voto aparece acá al instante.";
    box.appendChild(p); return;
  }
  const by={}; FOODS.forEach(f=>by[f.id]=[]);
  votes.forEach(v=>{ if(by[v.food]) by[v.food].push(v); });
  const max=Math.max(...Object.values(by).map(a=>a.length));
  FOODS.map(f=>({f,list:by[f.id]})).sort((a,b)=>b.list.length-a.list.length).forEach(({f,list})=>{
    const it=document.createElement("div"); it.className="res-item"+(list.length&&list.length===max?" top":"");
    const n=document.createElement("span"); n.className="n"; n.textContent=f.n;
    if(list.some(v=>v.id===uid)){ const m=document.createElement("span"); m.className="mine"; m.textContent="tu voto"; n.appendChild(m); }
    const c=document.createElement("span"); c.className="c";
    c.textContent=list.length+(list.length===1?" persona":" personas");
    const bar=document.createElement("div"); bar.className="bar";
    const i=document.createElement("i"); i.style.width=(list.length/votes.length*100)+"%"; bar.appendChild(i);
    it.append(n,c,bar);
    if(list.length){ const nm=document.createElement("div"); nm.className="names"; nm.textContent=list.map(v=>v.name).join(", "); it.appendChild(nm); }
    box.appendChild(it);
  });
}

// ---- Inicio
const saved=store.get("qc-name");
if(saved){ myName=saved; $("whoName").textContent=saved; show("vote"); } else show("name");
renderMenu();

if(firebaseConfig.apiKey==="PEGAR_ACA"){
  $("status").textContent="Falta configurar Firebase: pegá tu configuración al principio del script.";
}else{
  try{
    const app=initializeApp(firebaseConfig);
    const auth=getAuth(app);
    db=getFirestore(app);
    onAuthStateChanged(auth, u=>{
      if(!u) return;
      uid=u.uid; renderMenu();
      $("status").textContent="Se actualiza en vivo cuando alguien vota.";
      onSnapshot(collection(db,"votes"), snap=>{
        votes=snap.docs.map(d=>({id:d.id, ...d.data()})).filter(v=>v.name&&v.food);
        const mine=votes.find(v=>v.id===uid);
        if(mine && !hasVoted){
          hasVoted=true; picked=mine.food;
          if(!myName){ myName=mine.name; $("whoName").textContent=myName; }
          if(myName) show("done");
          renderMenu();
        }
        renderResults();
      }, err=>{ console.error(err); $("status").textContent="No se pudieron cargar los votos. Recargá la página."; });
    });
    signInAnonymously(auth).catch(err=>{
      console.error(err);
      $("status").textContent="No se pudo conectar. Revisá que el acceso anónimo esté activado en Firebase.";
    });
  }catch(err){
    console.error(err);
    $("status").textContent="La configuración de Firebase no es válida. Revisá los datos pegados.";
  }
}
</script>
</body>
</html>
